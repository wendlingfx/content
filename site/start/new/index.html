<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WFX | Back shortly</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--panel:#141414;--line:#262626;--text:#FFFFFF;--muted:#A3A3A3;--lime:#C6FF3D;--lime-ink:#0A0A0A}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.mark{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(56px,14vw,104px);letter-spacing:-.04em;line-height:1}
.mark span{color:var(--lime)}
h1{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(18px,4.2vw,24px);margin-top:28px}
p{color:var(--muted);font-size:16px;line-height:1.55;max-width:420px;margin-top:12px}
a.btn{display:inline-block;margin-top:28px;background:var(--lime);color:var(--lime-ink);font-weight:600;text-decoration:none;padding:13px 22px;border-radius:6px}
a.btn:hover{filter:brightness(1.08)}
footer{position:fixed;bottom:20px;left:0;right:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="mark">w<span>fx</span></div>
<h1>We are setting up the live account.</h1>
<p>The site comes back with the full track record shortly. Updates go out on Telegram first.</p>
<a class="btn" href="https://t.me/wendlingfx">Follow on Telegram</a>
<footer>wendlingfx.com</footer>
</body>
</html>
